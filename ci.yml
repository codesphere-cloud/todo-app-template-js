schemaVersion: v0.2
prepare:
  steps:
    - name: Install dependencies
      command: npm ci
test:
  steps:
    - name: Unit Tests
      command: yarn test --watchAll=false --passWithNoTests
run:
  app:
    steps:
      - name: Run
        command: npm start
    plan: 8
    replicas: 1
    network:
      ports:
        - port: 3000
          isPublic: false
      paths:
        - port: 3000
          path: /
