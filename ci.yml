schemaVersion: v0.2
prepare:
  steps:
    - name: Install dependencies
      command: npm ci
test:
  steps: []
run:
  app:
    plan: 202
    replicas: 1
    network:
      ports:
        - port: 3000
          isPublic: false
      paths:
        - port: 3000
          path: /
    steps:
      - name: Run
        command: npm start
